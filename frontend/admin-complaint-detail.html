<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Details - AI Smart Civic Services</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>
<body class="dashboard-layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo" style="font-size: 1.25rem;">
        <i data-lucide="landmark"></i> Civic Admin
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="admin-dashboard.html"><i data-lucide="layout-dashboard"></i> Overview</a>
      <a href="admin-complaints.html"><i data-lucide="list"></i> All Complaints</a>
    </nav>
    <div style="padding: 1.5rem;">
      <button onclick="ApiClient.clearToken(); window.location.href='admin-login.html'" class="btn btn-outline" style="width: 100%;">
        <i data-lucide="log-out"></i> Logout
      </button>
    </div>
  </aside>

  <main class="main-content">
    
    <!-- Top Action Bar -->
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
      <div>
        <a href="admin-complaints.html" style="font-size: 0.85rem; display: inline-flex; align-items: center; gap: 0.25rem; margin-bottom: 0.5rem;"><i data-lucide="arrow-left" style="width:14px; height:14px;"></i> Back to List</a>
        <h2>Complaint Details</h2>
        <p style="margin-bottom: 0; font-family: monospace; font-size: 0.85rem;" id="displayId">ID: --</p>
      </div>
      <div id="displayStatusBadge">
        <!-- Status badge injected here -->
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
      
      <!-- Left Column: Complaint Content -->
      <div>
        <!-- AI Insights Panel -->
        <div class="card" style="margin-bottom: 2rem; background-color: #F8FAFC; border: 1px solid #E2E8F0; box-shadow: none;">
          <h3 style="font-size: 1rem; color: var(--text-secondary); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <i data-lucide="bot"></i> AI Analysis
          </h3>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div>
              <strong style="display:block; font-size: 0.85rem; color: var(--text-secondary);">Category</strong>
              <div id="aiCategory" style="font-weight: 500;">--</div>
            </div>
            <div>
              <strong style="display:block; font-size: 0.85rem; color: var(--text-secondary);">Priority</strong>
              <div id="aiPriority">--</div>
            </div>
          </div>
          
          <div>
            <strong style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem;">Actionable Summary</strong>
            <p style="color: var(--text-primary); font-weight: 500; font-size: 1.1rem; margin-bottom: 0;" id="aiSummary">--</p>
          </div>
          
          <div style="margin-top: 1rem; font-size: 0.75rem; color: var(--text-secondary); text-align: right;">
            AI Confidence: <span id="aiConfidence">--</span>%
          </div>
        </div>

        <!-- Original Citizen Input -->
        <div class="card" style="margin-bottom: 2rem;">
          <h3 style="font-size: 1.1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1.5rem;">Original Submission</h3>
          
          <div style="margin-bottom: 1.5rem;">
            <strong style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Description</strong>
            <p id="originalDesc" style="white-space: pre-wrap;">--</p>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
              <strong style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem;">Location</strong>
              <p id="originalLocation">--</p>
            </div>
            <div>
              <strong style="display:block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.25rem;">Contact Info</strong>
              <p id="originalContact">--</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Actions and Timeline -->
      <div>
        
        <!-- Admin Actions Card -->
        <div class="card" style="margin-bottom: 2rem;">
          <h3 style="font-size: 1.1rem; margin-bottom: 1.5rem;">Admin Actions</h3>
          
          <div class="form-group">
            <label class="form-label" style="font-size: 0.85rem;">Assign Department</label>
            <div style="display: flex; gap: 0.5rem;">
              <select id="actionAssign" class="form-control">
                <option value="">-- Select --</option>
                <option value="Road Department">Road Department</option>
                <option value="Water/Drainage Dept">Water/Drainage Dept</option>
                <option value="Sanitation/Waste">Sanitation/Waste</option>
                <option value="Electricity Board">Electricity Board</option>
                <option value="Public Safety">Public Safety</option>
              </select>
              <button class="btn btn-primary" onclick="assignDepartment()">Save</button>
            </div>
          </div>
          
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label" style="font-size: 0.85rem;">Update Status</label>
            <div style="display: flex; gap: 0.5rem;">
              <select id="actionStatus" class="form-control">
                <option value="Open">Open</option>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="Resolved">Resolved</option>
              </select>
              <button class="btn btn-outline" onclick="updateStatus()">Update</button>
            </div>
          </div>
          
        </div>

        <!-- History Timeline -->
        <div class="card">
          <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">Status Timeline</h3>
          <!-- We reuse the timeline CSS styles defined in track-complaint.html via JS inline or add to dashboard.css if preferred. 
               For now, we'll inline a few simple rules directly in the JS generator. -->
          <div id="timelineContainer" style="padding-left: 1rem; border-left: 2px solid var(--border-color); margin-left: 0.5rem;">
            <!-- Timeline items injected via JS -->
          </div>
        </div>

      </div>
    </div>

  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-complaint-detail.js"></script>
  <script>lucide.createIcons();</script>
  <script src="js/theme.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const adminBtn = document.getElementById('admin-menu-btn');
      const sidebar = document.getElementById('sidebar');
      if(adminBtn && sidebar) {
        adminBtn.addEventListener('click', () => {
          sidebar.classList.toggle('open');
        });
      }
    });
  </script>
</body>
</html>

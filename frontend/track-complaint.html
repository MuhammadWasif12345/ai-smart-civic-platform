<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Complaint - AI Smart Civic Services</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
  <link rel="stylesheet" href="css/variables.css?v=4">
  <link rel="stylesheet" href="css/base.css?v=8">
  <link rel="stylesheet" href="css/components.css?v=4">
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Timeline styles specific to this page */
    .timeline {
      position: relative;
      padding-left: 2rem;
      margin-top: 1.5rem;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background-color: var(--border-color);
    }
    .timeline-item {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -2.4rem;
      top: 0.25rem;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: var(--primary-color);
      border: 3px solid white;
    }
    .timeline-date {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .timeline-status {
      font-weight: 600;
      color: var(--text-primary);
    }
  </style>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
</head>
<body>

  <header>
    <div class="container">
      <button class="theme-toggle-btn mobile-theme-toggle" aria-label="Toggle Night Mode">
        <i data-lucide="moon" class="theme-icon"></i>
      </button>
      <button id="mobile-menu-btn" class="hamburger">
        <i data-lucide="menu"></i>
      </button>
      <a href="index.html" class="logo" style="display:flex; align-items:flex-start; gap:0.5rem; text-decoration:none;">
        <i data-lucide="shield-check" style="width:20px; margin-top:2px;"></i>
        <div style="display:flex; flex-direction:column; align-items:flex-start; line-height:1;">
            <span style="white-space:nowrap; font-size:1.1rem; font-weight:700;">AI Smart Civic</span>
            <span style="font-size:0.65rem; background:var(--brand-primary); color:white; padding:0.15rem 0.4rem; border-radius:4px; margin-top:2px; font-weight:600; letter-spacing:0.05em;">AI Powered</span>
        </div>
      </a>
      
      
      <div class="nav-links">
        <a href="portal.html">Citizen Portal</a>
        <a href="track-complaint.html">Track Complaint</a>
        <a href="index.html#how-it-works">How It Works</a>
        <a href="index.html#ai-copilot">AI Copilot</a>
        
        <button class="theme-toggle-btn desktop-theme-toggle" aria-label="Toggle Night Mode">
          <i data-lucide="moon" class="theme-icon"></i>
        </button>
        <a href="portal.html" class="btn btn-outline" style="padding: 0.4rem 1rem;">Sign In / Admin</a>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 3rem; padding-bottom: 3rem; max-width: 800px;">
    
    <div class="card" id="searchCard" style="margin-bottom: 2rem;">
      <h2>Track Your Complaint</h2>
      <p style="margin-bottom: 2rem;">Enter your Complaint ID to see its current status.</p>
      
      <form id="trackForm" style="display: flex; gap: 1rem;">
        <div style="flex: 1;">
          <input type="text" id="complaint_id" class="form-control" placeholder="e.g., c8f1a2e4-9b3d-4a11-..." required>
        </div>
        <button type="submit" class="btn btn-primary">Track <i data-lucide="search"></i></button>
      </form>
      <div id="searchError" class="error-text" style="margin-top: 1rem; font-size: 1rem;"></div>
    </div>

    <!-- Results Card (Hidden by default) -->
    <div class="card" id="resultCard" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
        <div>
          <h3 style="margin-bottom: 0.25rem;">Complaint Status</h3>
          <p style="font-size: 0.85rem; font-family: monospace;" id="displayId"></p>
        </div>
        <div id="displayStatusBadge"></div>
      </div>

      <!-- Detail Grid -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; background-color: #F9FAFB; padding: 1.5rem; border-radius: var(--border-radius);">
        <div>
          <strong style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Category</strong>
          <div id="displayCategory" style="font-weight: 500; margin-top: 0.25rem;"></div>
        </div>
        <div>
          <strong style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Priority</strong>
          <div id="displayPriority" style="margin-top: 0.25rem;"></div>
        </div>
        <div style="grid-column: span 2;">
          <strong style="color: var(--text-secondary); font-size: 0.85rem; text-transform: uppercase;">Assigned Department</strong>
          <div id="displayDepartment" style="font-weight: 500; margin-top: 0.25rem;"></div>
        </div>
      </div>

      <h4>Timeline</h4>
      <div id="timelineContainer" class="timeline">
        <!-- History items injected here by JS -->
      </div>
    </div>

  </main>

  <script src="js/track-complaint.js?v=4"></script>
  <script>lucide.createIcons();</script>
  <script src="js/theme.js?v=7"></script>
</body>
</html>

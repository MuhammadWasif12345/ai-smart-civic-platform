<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Complaints - AI Smart Civic Services</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  
  <style>
    /* Admin Layout Styles */
    body {
      background-color: var(--bg-secondary);
      margin: 0;
      display: flex;
      flex-direction: row; /* Overrides base.css column direction */
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-speed) ease;
      z-index: 100;
    }

    .sidebar-header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-nav {
      flex: 1;
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: var(--border-radius);
      margin-bottom: 0.5rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .sidebar-link:hover, .sidebar-link.active {
      background-color: rgba(34, 184, 240, 0.1);
      color: var(--brand-primary);
      text-decoration: none;
    }

    .sidebar-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--brand-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Main Content Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      height: 70px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
    }

    .content-area {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    /* Mobile Sidebar Toggle */
    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
    }

    /* Complaints Table Specifics */
    .filter-bar {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      background-color: var(--bg-card);
      padding: 1rem;
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .filter-bar .form-control {
      width: 160px;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }
    
    .table-container {
      background-color: var(--bg-card);
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.05em;
      background-color: rgba(15, 23, 42, 0.02);
    }
    [data-theme="dark"] th {
      background-color: rgba(255, 255, 255, 0.02);
    }

    tbody tr {
      transition: background-color 0.2s;
    }

    tbody tr:hover {
      background-color: rgba(34, 184, 240, 0.05);
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
      }
      .mobile-toggle {
        display: block;
      }
      .topbar { padding: 0 1rem; }
      .content-area { padding: 1rem; }
    }
  </style>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || (!savedTheme && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="logo" style="font-size: 1.1rem;">
        <i data-lucide="shield-check" style="color: var(--brand-primary);"></i> AI Smart Civic
      </a>
    </div>
    
    <nav class="sidebar-nav">
      <div style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.75rem; padding-left: 1rem; font-weight: 700;">Menu</div>
      <a href="admin-dashboard.html" class="sidebar-link">
        <i data-lucide="layout-dashboard"></i> Dashboard
      </a>
      <a href="admin-complaints.html" class="sidebar-link active">
        <i data-lucide="inbox"></i> All Complaints
      </a>
      <a href="#" class="sidebar-link" onclick="showComingSoon('Analytics Dashboard'); return false;">
        <i data-lucide="bar-chart-2"></i> Analytics
      </a>
      <a href="#" class="sidebar-link" onclick="showComingSoon('Settings Panel'); return false;">
        <i data-lucide="settings"></i> Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">A</div>
        <div style="flex: 1;">
          <div style="font-size: 0.9rem; font-weight: 600; color: var(--text-primary);">Admin User</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Super Admin</div>
        </div>
        <button id="logoutBtn" style="background:none; border:none; color:var(--text-secondary); cursor:pointer;" title="Logout">
          <i data-lucide="log-out"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button class="mobile-toggle" id="mobileToggle">
          <i data-lucide="menu"></i>
        </button>
        <div>
          <h2 style="margin: 0; font-size: 1.25rem;">All Complaints</h2>
          <span style="font-size: 0.85rem; color: var(--text-secondary);">Manage and monitor citizen reports</span>
        </div>
      </div>
      
      <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Night Mode">
          <i data-lucide="moon" id="theme-icon"></i>
        </button>
      </div>
    </header>

    <div class="content-area">
      
      <!-- Filters -->
      <form class="filter-bar" id="filterForm">
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-right: auto;">
          <i data-lucide="filter" style="width: 18px; color: var(--text-muted);"></i>
          <span style="font-size: 0.9rem; font-weight: 600;">Filters</span>
        </div>
        
        <select id="filterStatus" class="form-control">
          <option value="">All Statuses</option>
          <option value="Open">Open</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
        
        <select id="filterPriority" class="form-control">
          <option value="">All Priorities</option>
          <option value="Critical">Critical</option>
          <option value="High">High</option>
          <option value="Medium">Medium</option>
          <option value="Low">Low</option>
        </select>
        
        <select id="filterCategory" class="form-control">
          <option value="">All Categories</option>
          <option value="Electricity">Electricity</option>
          <option value="Road">Road</option>
          <option value="Safety">Safety</option>
          <option value="Waste/Garbage">Waste/Garbage</option>
          <option value="Water/Drainage">Water/Drainage</option>
        </select>
        
        <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1rem;">Apply</button>
        <button type="button" class="btn btn-outline" id="resetFilters" style="padding: 0.5rem 1rem;">Clear</button>
      </form>
      
      <!-- Table Info -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <span style="font-size: 0.9rem; color: var(--text-secondary);">Total found: <strong id="totalCount" style="color: var(--text-primary);">...</strong></span>
      </div>

      <!-- Data Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Summary</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Department</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Data will be injected here via JS -->
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/admin-complaints.js"></script>
  <script src="js/theme.js"></script>
  <script>
    function showComingSoon(feature) {
      const toast = document.createElement('div');
      toast.style.position = 'fixed';
      toast.style.bottom = '20px';
      toast.style.right = '20px';
      toast.style.backgroundColor = 'var(--bg-card)';
      toast.style.color = 'var(--text-primary)';
      toast.style.padding = '1rem 1.5rem';
      toast.style.borderRadius = '8px';
      toast.style.boxShadow = '0 10px 25px rgba(0,0,0,0.1)';
      toast.style.borderLeft = '4px solid var(--brand-primary)';
      toast.style.border = '1px solid var(--border)';
      toast.style.borderLeft = '4px solid var(--brand-primary)';
      toast.style.zIndex = '9999';
      toast.style.transition = 'opacity 0.3s ease';
      toast.style.display = 'flex';
      toast.style.alignItems = 'center';
      toast.style.gap = '0.75rem';
      toast.innerHTML = `<i data-lucide="info" style="color: var(--brand-primary);"></i> <div><strong style="display:block;font-size:0.9rem;">Coming Soon</strong><span style="font-size:0.8rem;color:var(--text-muted);">${feature} is not yet available.</span></div>`;
      document.body.appendChild(toast);
      lucide.createIcons();
      
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // Logout Logic
    document.getElementById('logoutBtn').addEventListener('click', () => {
      ApiClient.clearToken();
      window.location.href = 'admin-login.html';
    });
    
    // Mobile Sidebar
    document.getElementById('mobileToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
  </script>
</body>
</html>
